<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Para ti</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>

<button class="btn-sound" id="btn-sound" aria-label="Música">🔈</button>

<div id="app">

  <!-- ESCENA 1: INICIO -->
  <section class="scene" id="scene-intro">
    <div class="intro-text">
      <p class="line line-1">Hoy no es un día cualquiera&hellip;</p>
      <p class="line line-2">Hoy es tu día.</p>
    </div>
    <button class="btn-elegant" id="btn-comenzar">
      <span class="btn-halo"></span>
      <span class="btn-label"><span class="spark">✨</span> Comenzar</span>
    </button>
  </section>

  <!-- ESCENA 2: EL LIBRO (avance manual) -->
  <section class="scene" id="scene-book">
    <div class="book-wrap">
      <div class="book" id="book">
        <div class="book-glow"></div>

        <div class="book-pages" id="book-pages">
          <div class="page-texture"></div>
          <div class="story-page" id="story-page">
            <p class="story-line" id="story-line"></p>
          </div>
        </div>

        <div class="book-cover" id="book-cover">
          <div class="cover-face">
            <span class="corner corner-tl">❧</span>
            <span class="corner corner-tr">❧</span>
            <span class="corner corner-bl">❧</span>
            <span class="corner corner-br">❧</span>
            <div class="cover-emblem">
              <span class="cover-emblem-star">✦</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="book-hint" id="book-hint">Toca para abrir</p>
  </section>

  <!-- ESCENA 3: NOCHE — PERSONAJE, MENSAJE Y TORTA -->
  <section class="scene" id="scene-night">

    <div class="night-ground"></div>

    <div class="character" id="character">
      <svg viewBox="0 0 220 340" class="char-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2e1a10"/>
            <stop offset="100%" stop-color="#160b06"/>
          </linearGradient>
          <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#232220"/>
            <stop offset="100%" stop-color="#111110"/>
          </linearGradient>
          <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d9a26f"/>
            <stop offset="100%" stop-color="#c48a58"/>
          </linearGradient>
        </defs>

        <ellipse cx="110" cy="326" rx="44" ry="7" class="char-shadow"/>

        <!-- pierna trasera (pantalón negro) -->
        <g class="char-leg char-leg-back" style="transform-origin:100px 220px;">
          <path d="M91 220 L109 220 L106 282 C106 286, 96 286, 96 282 Z" fill="#18100c"/>
          <ellipse cx="99" cy="288" rx="12" ry="6" fill="#f4efe4"/>
          <rect x="90" y="284" width="18" height="4" rx="2" fill="#e7e0cf"/>
        </g>

        <g class="char-hair-back">
          <path d="M110 58 C54 54, 40 150, 60 205 C68 224, 80 222, 84 206 C69 156, 76 90, 110 82 Z" fill="url(#hairGrad)"/>
          <path d="M110 58 C166 54, 180 150, 160 205 C152 224, 140 222, 136 206 C151 156, 144 90, 110 82 Z" fill="url(#hairGrad)"/>
        </g>

        <g class="char-body-group">
          <!-- brazo trasero (manga negra, puño crema) -->
          <path class="char-arm-back" d="M94 154 C80 166, 74 182, 78 200" stroke="url(#coatGrad)" stroke-width="11" stroke-linecap="round" fill="none" style="transform-origin:94px 154px;"/>
          <path d="M76 194 C77 197, 80 200, 83 201" stroke="var(--ivory)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" style="transform-origin:94px 154px;" class="char-cuff-back"/>

          <!-- cárdigan (cuerpo) -->
          <path d="M83 146 C83 130, 137 130, 137 146 L146 226 C146 236, 74 236, 74 226 Z" fill="url(#coatGrad)"/>
          <!-- top interior visible en el cuello -->
          <path d="M99 146 L121 146 L116 168 L104 168 Z" fill="#3a1f22"/>
          <!-- ribetes crema del cárdigan -->
          <path d="M99 146 C103 142, 117 142, 121 146 L118 152 C114 149, 106 149, 102 152 Z" fill="var(--ivory)"/>
          <path d="M95 148 L88 226" stroke="var(--ivory)" stroke-width="5" fill="none" opacity="0.95"/>
          <path d="M125 148 L132 226" stroke="var(--ivory)" stroke-width="5" fill="none" opacity="0.95"/>
          <rect x="96" y="182" width="13" height="10" rx="1.5" fill="var(--ivory)" opacity="0.9"/>
          <circle cx="102" cy="187" r="1.3" fill="#8a7550"/>

          <!-- brazo delantero (sostiene la bandeja) -->
          <path class="char-arm-front" d="M128 156 C142 164, 148 176, 146 190" stroke="url(#coatGrad)" stroke-width="11" stroke-linecap="round" fill="none"/>
          <path d="M141 184 C143 187, 145 189, 147 190" stroke="var(--ivory)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

          <!-- cabeza -->
          <circle cx="110" cy="108" r="33" fill="url(#skinGrad)"/>

          <!-- orejas + aros -->
          <circle cx="79" cy="112" r="4" fill="#c48a58"/>
          <circle cx="141" cy="112" r="4" fill="#c48a58"/>
          <circle class="char-earring" cx="79" cy="123" r="6" fill="none" stroke="var(--gold-soft)" stroke-width="2"/>
          <circle class="char-earring" cx="141" cy="123" r="6" fill="none" stroke="var(--gold-soft)" stroke-width="2"/>

          <!-- cejas -->
          <path d="M90 96 C95 92, 103 92, 107 95" stroke="#2e1a10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M113 95 C117 92, 125 92, 130 96" stroke="#2e1a10" stroke-width="2.4" fill="none" stroke-linecap="round"/>

          <!-- ojos felices (cerrados, riendo) -->
          <path d="M91 106 C95 101, 103 101, 107 106" stroke="#2a180e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path d="M113 106 C117 101, 125 101, 129 106" stroke="#2a180e" stroke-width="2.6" fill="none" stroke-linecap="round"/>

          <!-- mejillas -->
          <ellipse cx="90" cy="118" rx="6" ry="4" fill="#e39a6b" opacity="0.45"/>
          <ellipse cx="130" cy="118" rx="6" ry="4" fill="#e39a6b" opacity="0.45"/>

          <!-- sonrisa amplia -->
          <path d="M92 118 C98 132, 122 132, 128 118 C122 126, 98 126, 92 118 Z" fill="#8a3b2e"/>
          <path d="M96 120 C101 127, 119 127, 124 120 C119 124, 101 124, 96 120 Z" fill="#fff8ec"/>

          <!-- cabello hacia atrás, raya al medio, sin flequillo -->
          <path d="M79 92 C79 79, 96 72, 110 72 C124 72, 141 79, 141 92 C141 83, 124 76, 110 76 C96 76, 79 83, 79 92 Z" fill="url(#hairGrad)"/>
          <path d="M110 72 L110 80" stroke="#0e0704" stroke-width="1.6" opacity="0.6"/>
        </g>

        <!-- pierna delantera (pantalón negro) -->
        <g class="char-leg char-leg-front" style="transform-origin:120px 220px;">
          <path d="M111 220 L129 220 L127 282 C127 286, 117 286, 117 282 Z" fill="#211712"/>
          <ellipse cx="121" cy="288" rx="12" ry="6" fill="#fbf8ef"/>
          <rect x="112" y="284" width="18" height="4" rx="2" fill="#efe9da"/>
        </g>

        <!-- bandeja con pastelito -->
        <g class="char-cake" transform="translate(130 186)">
          <ellipse cx="16" cy="18" rx="30" ry="6" fill="var(--gold-soft)" opacity="0.9"/>
          <rect x="-2" y="-10" width="36" height="18" rx="4" fill="#f6ecd6"/>
          <rect x="-2" y="-10" width="36" height="5" rx="2.5" fill="#fff7e6"/>
          <g class="mini-flame">
            <rect x="14" y="-18" width="2" height="7" fill="var(--gold)"/>
            <path d="M15 -20 C12.5 -24, 12.5 -27, 15 -31 C17.5 -27, 17.5 -24, 15 -20 Z" fill="var(--flame)"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="scene-message" id="scene-message">
      <p class="msg-title">Feliz cumpleaños <span class="heart">❤️</span></p>
      <p class="msg-sub">Esta celebración es para ti.</p>
    </div>

    <div class="hint-chip" id="hint-text"><span>Toca cada vela para apagarla</span></div>

    <!-- PASTEL GRANDE INTERACTIVO -->
    <div class="cake-wrap" id="cake-wrap">
      <div class="candles" id="candles"><!-- generadas por JS --></div>
      <div class="cake-big">
        <div class="cake-tier cake-tier-top">
          <span class="cake-ornament orn-1">✦</span>
          <span class="cake-ornament orn-2">❀</span>
          <span class="cake-ornament orn-3">✦</span>
          <div class="cake-piping"></div>
        </div>
        <div class="cake-tier cake-tier-bottom">
          <div class="cake-ribbon"></div>
          <div class="cake-piping cake-piping-2"></div>
        </div>
        <div class="cake-plate"></div>
      </div>
    </div>

    <button class="btn-elegant btn-continue" id="btn-continue">
      <span class="btn-halo"></span>
      <span class="btn-label">Continuar</span>
    </button>

  </section>

  <!-- ESCENA 3: CARTA (SOBRE) -->
  <section class="scene" id="scene-letter">
    <div class="envelope-wrap" id="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="envelope-glow"></div>
        <div class="envelope-body"></div>
        <div class="envelope-flap" id="envelope-flap"></div>
        <div class="envelope-seal">
          <span>✦</span>
        </div>
        <p class="envelope-label">Para ti</p>
      </div>
      <p class="envelope-hint">Toca el sobre</p>
    </div>

    <div class="letter-page" id="letter-page">
      <div class="letter-paper">
        <span class="letter-deco letter-deco-top">✦ ❧ ✦</span>
        <div class="letter-body" id="letter-body"><!-- generado por JS --></div>
        <span class="letter-deco letter-deco-bottom">✦</span>
      </div>
    </div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
